# Mosquitto do laboratorio (ADR-005)
listener 1883
persistence true                 # mensagens QoS 1 retidas sobrevivem a restart do broker
persistence_location /mosquitto/data/
max_queued_messages 100000       # fila por sessao persistente (gateway fora do ar)
max_inflight_messages 20         # backpressure: no maximo 20 QoS 1 sem PUBACK por cliente
allow_anonymous true             # SO NO LAB. Producao: ver ADR-005 (TLS 8883 + senha/certificado por dispositivo + ACL)
log_type error
log_type warning
log_type notice
