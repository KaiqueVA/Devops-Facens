# Testes unitarios das regras de alerta:  promtool test rules testes-alertas.yml
# (rodam no pipeline: alerta quebrado tambem bloqueia o deploy - ADR-006)
rule_files:
  - alertas.yml
evaluation_interval: 10s

tests:
  - name: IA fora por 2 min -> ComponenteFora e IaDegradada disparam (ADR-003)
    interval: 10s
    input_series:
      - series: 'up{job="ia-service"}'
        values: '1 1 1 0x12'
      # 10 recomendacoes/10s; a partir de t=30s todas caem no catalogo padrao
      - series: 'ia_recomendacoes_total{origem="ia"}'
        values: '0+10x2 30x12'
      - series: 'ia_recomendacoes_total{origem="catalogo_padrao"}'
        values: '0x2 0+10x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: ComponenteFora
        exp_alerts:
          - exp_labels: {severidade: critica, job: ia-service}
            exp_annotations:
              resumo: "ia-service nao responde ao Prometheus ha 30s"
              adr: "ADR-006 (deploy independente: cada componente e observado separadamente)"
      - eval_time: 2m
        alertname: IaDegradada
        exp_alerts:
          - exp_labels: {severidade: alta}
            exp_annotations:
              resumo: "Mais de 5% das recomendacoes estao saindo do catalogo padrao"
              adr: "ADR-003 - gatilho para adotar circuit breaker"

  - name: IA saudavel -> nenhum alerta de degradacao
    interval: 10s
    input_series:
      - series: 'ia_recomendacoes_total{origem="ia"}'
        values: '0+10x12'
      - series: 'ia_recomendacoes_total{origem="catalogo_padrao"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: IaDegradada
        exp_alerts: []

  - name: Provedor de notificacao fora -> NotificacoesRetidas (ADR-004)
    interval: 10s
    input_series:
      - series: 'outbox_pendente_mais_antiga_seconds'
        values: '0 0 10+10x24'
    alert_rule_test:
      - eval_time: 1m
        alertname: NotificacoesRetidas
        exp_alerts: []
      - eval_time: 4m
        alertname: NotificacoesRetidas
        exp_alerts:
          - exp_labels: {severidade: alta}
            exp_annotations:
              resumo: "Ha entrega pendente no outbox ha mais de 2 minutos (consumidor fora?)"
              adr: "ADR-004 - consistencia eventual saiu do esperado"

  - name: Core fora -> gateway retem eventos (ADR-005)
    interval: 10s
    input_series:
      - series: 'iot_fila_interna'
        values: '0 1x18'
      - series: 'iot_retentativas_total'
        values: '0 0+1x18'
    alert_rule_test:
      - eval_time: 2m
        alertname: IotGatewayRetendoEventos
        exp_alerts:
          - exp_labels: {severidade: alta}
            exp_annotations:
              resumo: "O iot-gateway esta retendo eventos porque o Core nao aceita"
              adr: "ADR-005 - eventos seguros no broker, mas sem chegar ao Core"
