# Prometheus do laboratorio (ADR-006). Um job por componente com deploy independente.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
        labels: {componente: core-gamificacao}

  - job_name: ia-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["ia-service:8000"]
        labels: {componente: ia-service}

  - job_name: iot-gateway
    static_configs:
      - targets: ["iot-gateway:9101"]
        labels: {componente: iot-gateway}
