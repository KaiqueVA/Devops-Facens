# Somente testes (classpath:/config/ tem precedencia sobre o application.properties principal).
# Cada contexto Spring de teste ganha seu proprio H2: testes nao enxergam dados uns dos outros.
spring.datasource.url=jdbc:h2:mem:teste-${random.uuid};DB_CLOSE_DELAY=-1
# O relay agendado fica desligado; os testes do outbox acionam o relay explicitamente.
eventos.relay.habilitado=false
