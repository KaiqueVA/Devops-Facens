spring.application.name=gamificacao-ead

spring.datasource.url=jdbc:h2:mem:gamificacao
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Desafio 3 (ADR-003): fronteira com o ia-service Python ---
ia.url=${IA_URL:http://localhost:8000}
ia.timeout.conexao-ms=300
ia.timeout.recomendacao-ms=800
ia.timeout.assistente-ms=3000

# --- Desafio 4 (ADR-004): eventos via transactional outbox, sem broker ---
# assincrona (padrao) = outbox + relay | sincrona = chama assinantes dentro da requisicao (so para o lab)
eventos.entrega=${EVENTOS_ENTREGA:assincrona}
eventos.relay.habilitado=true
eventos.relay.intervalo-ms=2000
eventos.relay.lote=50
eventos.relay.max-tentativas=8
eventos.relay.backoff-base-ms=1000
eventos.relay.backoff-teto-ms=60000
notificacao.url=${NOTIFICACAO_URL:http://localhost:8090}
notificacao.timeout-ms=2000

# --- Desafio 6 (ADR-006): observabilidade ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=core-gamificacao
# histograma de latencia por endpoint: p95 do /ranking (gatilho do ADR-001) e da conclusao (ADR-004)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,300ms,800ms
