# Ativado com --spring.profiles.active=postgres (ou SPRING_PROFILES_ACTIVE=postgres no Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/gamificacao
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=gamificacao
spring.datasource.password=gamificacao
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
